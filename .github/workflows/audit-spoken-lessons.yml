name: Verify Speakathon Day-by-Day Content
on:
  workflow_dispatch:
  push:
    branches:
      - speakathon-self-hosted-course-20261013
permissions:
  contents: read
  actions: read
jobs:
  audit-content:
    runs-on: ubuntu-latest
    timeout-minutes: 24
    steps:
      - uses: actions/checkout@v4
      - name: Restore final clean website with local videos and PDFs
        uses: actions/download-artifact@v4
        with:
          name: Shalini-Final-Clean-Speakathon-ZIP
          run-id: 38429288876
          repository: jayantc1011/shalini-rathod
          github-token: ${{ secrets.GITHUB_TOKEN }}
          path: output/shalini-rathod-website
      - name: Install audio transcription and PDF audit dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq ffmpeg >/dev/null
          pip install --quiet faster-whisper pypdf
      - name: Compare real lesson texts and spoken intros
        run: |
          python -u scripts/audit_spoken_video_days.py output/shalini-rathod-website 2>&1 | tee output/course-content-audit.log
      - name: Store findings for review
        uses: actions/upload-artifact@v4
        with:
          name: Shalini-Lesson-Content-Audit
          path: output/course-content-audit.log
          retention-days: 7
