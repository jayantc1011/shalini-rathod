name: Validate Speakathon Compression Notebook
on:
  push:
    branches:
      - speakathon-self-hosted-course-20261013
jobs:
  validate-notebook:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check Colab notebook JSON and Python syntax
        run: |
          python - <<'PY'
          import json,ast
          from pathlib import Path
          x=json.loads(Path("tools/compress-missing-speakathon-videos.ipynb").read_text())
          assert x['nbformat']==4
          source=''.join(x['cells'][1]['source'])
          ast.parse(source)
          assert 'NEEDED = [12, 13, 14, 16, 17, 18, 19, 20, 21]' in source
          assert 'TARGET_BYTES = 185 * 1024 * 1024' in source
          assert 'auth.authenticate_user()' in source
          assert 'MediaIoBaseDownload' in source
          print('PASS: original Drive folder scan, safe 9 MP4 compression, destination upload')
          PY