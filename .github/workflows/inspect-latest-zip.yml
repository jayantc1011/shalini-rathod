name: Verify Public Media Fetch
on:
  push:
    branches:
      - speakathon-self-hosted-course-20261013
jobs:
  verify-media:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Download one worksheet and video
        run: |
          python -m pip install -q gdown
          python - <<'PY'
          import gdown
          from pathlib import Path
          for label,fid,ext in [
            ("worksheet","1oE57fWTVJvsqGAvXEJ1obDNweq7V4T_P","pdf"),
            ("video","1xBfZYGdYWfoytZ1e7UqKtHXpKzj7c7az","mp4")
          ]:
            try:
              dest=Path(f"sample-{label}.{ext}")
              r=gdown.download(id=fid,output=str(dest),quiet=True)
              ok=dest.exists() and dest.stat().st_size>100000
              print(label,"download",ok,"bytes",dest.stat().st_size if dest.exists() else 0,"result",r)
              if ok: print(label,"header",dest.read_bytes()[:14])
            except Exception as e: print(label,"ERROR",str(e)[:400])
          PY