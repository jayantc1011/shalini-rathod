name: Inspect Latest Shalini ZIP
on:
  push:
    branches:
      - speakathon-self-hosted-course-20261013
jobs:
  inspect-source:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Fetch and unpack actual latest source
        run: |
          curl -fLsS --max-time 120 -o latest.zip "https://at.adobe.com/RudnTowCZMZuUBr7"
          unzip -t latest.zip | tail -2
          unzip -oq latest.zip -d src
      - name: Report course data, layout, renderer
        run: |
          python - <<'PY'
          from pathlib import Path
          root=Path("src/shalini-rathod-website")
          for f in ["courses-data.js","lms.js","lms-learn.html","README.md"]:
              s=(root/f).read_text()
              print("\n\n======== FILE",f,"========")
              if f=="courses-data.js":
                  print(s[:24000])
              elif f=="lms.js":
                  print(s[:24000])
              elif f=="lms-learn.html":
                  print(s[:13000])
              else:
                  print(s[:4000])
          PY
