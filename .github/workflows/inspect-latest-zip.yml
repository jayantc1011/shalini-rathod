name: Inspect Speakathon Video Geometry
on:
  push:
    branches:
      - speakathon-self-hosted-course-20261013
jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Inspect original recording and CSS
        run: |
          curl -fLsS --retry 2 -o day1.mp4 "https://at.adobe.com/A1WQFRVTHDCZCRLI"
          echo "VIDEO METADATA"
          ffprobe -v error -select_streams v:0 -show_entries stream=width,height,sample_aspect_ratio,display_aspect_ratio,rotation,codec_name -of json day1.mp4
          echo "EXTRACT VIDEO ROTATION DATA"
          ffprobe -v error -select_streams v:0 -show_entries stream_side_data -of json day1.mp4
          curl -fLsS --retry 2 -o latest.zip "https://at.adobe.com/RudnTowCZMZuUBr7"
          unzip -oq latest.zip -d src
          python - <<'PY'
          from pathlib import Path
          s=Path('src/shalini-rathod-website/style.css').read_text()
          import re
          for m in re.finditer(r'(?s)([^{}]*video[^{}]*|[^{}]*lms-learn-video-frame[^{}]*)\{([^{}]*)\}',s,re.I):
              print('SELECTOR',m.group(1).strip()[:220],'BODY',m.group(2).strip()[:350])
          PY