name: Build Redesigned Speakathon Learning Studio
on:
  push:
    branches:
      - speakathon-self-hosted-course-20261013
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Read latest verified website ZIP
        run: |
          set -euo pipefail
          curl -fLsS --retry 2 -o source.zip "https://at.adobe.com/RudnTowCZMZuUBr7"
          unzip -t source.zip | tail -2
          mkdir -p output
          unzip -oq source.zip -d output
      - name: Upgrade LMS course UI and remove Drive links
        run: |
          python scripts/build_self_hosted_lms.py output/shalini-rathod-website
          python scripts/fix_speakathon_video.py output/shalini-rathod-website
          python scripts/rebuild_study_ui.py output/shalini-rathod-website
      - name: Download original 21 PDFs into website
        run: |
          set -euo pipefail
          dest="output/shalini-rathod-website/assets/lms/pdfs"
          mkdir -p "$dest"
          while read -r day url; do
            echo "Downloading worksheet Day $day"
            curl -fLsS --retry 2 --max-time 180 "$url" -o "$dest/day-$day.pdf"
            python -c 'from pathlib import Path; import sys; p=Path(sys.argv[1]); assert p.stat().st_size>10000 and p.read_bytes()[:4]==b"%PDF", str(p)' "$dest/day-$day.pdf"
          done <<'PDFS'
          01 https://at.adobe.com/VtDmDVxo0071o4vj
          02 https://at.adobe.com/jUG2bJ04Bxr4hyj2
          03 https://at.adobe.com/AkPpjTkhNu3zk50I
          04 https://at.adobe.com/E63h8GuqGnZhTbGN
          05 https://at.adobe.com/OhsKMww3XMlCOQBH
          06 https://at.adobe.com/9YjAg4aRb9S4zkVp
          07 https://at.adobe.com/62bFwg2kWF1jtVUY
          08 https://at.adobe.com/CRvGJNFrEwZgdbYJ
          09 https://at.adobe.com/rLHaLGzbHILUWWpd
          10 https://at.adobe.com/lO70K2Wn860tubgf
          11 https://at.adobe.com/jPWSFhvNzEdpBTYa
          12 https://at.adobe.com/50CGOyssCQM2BMq2
          13 https://at.adobe.com/OPEa5QKrJkZdGU6o
          14 https://at.adobe.com/NX4rbi2KtmryjFLL
          15 https://at.adobe.com/3rtInPETuSDjiF2c
          16 https://at.adobe.com/9p2AEuzZOIuAI6tu
          17 https://at.adobe.com/8FqmldrJxz00Cili
          18 https://at.adobe.com/RJXb1xplSHojYMrV
          19 https://at.adobe.com/4mOYo8n1dzn1RRWk
          20 https://at.adobe.com/JPmQrg1Q3yQnWtky
          21 https://at.adobe.com/nl3rv05k9FTYawSY
          PDFS
      - name: Include original Day 1 recording
        run: |
          set -euo pipefail
          video="output/shalini-rathod-website/assets/lms/videos/day-01.mp4"
          curl -fLsS --retry 2 --max-time 240 "https://at.adobe.com/A1WQFRVTHDCZCRLI" -o "$video"
          python -c 'from pathlib import Path; import sys; p=Path(sys.argv[1]); data=p.read_bytes()[:32]; assert p.stat().st_size>1000000 and b"ftyp" in data, f"Not MP4: {p}"; print("Video ready:",p.stat().st_size,"bytes")' "$video"
      - name: Add original lesson videos and example recordings
        run: |
          set -euo pipefail
          python -m pip install -q imageio-ffmpeg
          FFMPEG="$(python -c 'import imageio_ffmpeg;print(imageio_ffmpeg.get_ffmpeg_exe())')"
          dest="output/shalini-rathod-website/assets/lms/videos"
          mkdir -p "$dest"
          while read -r name url; do
            echo "DOWNLOAD: $name"
            curl -fLsS --retry 3 --retry-delay 2 --max-time 1200 "$url" -o "/tmp/speakathon-input.mp4"
            python -c 'import sys;from pathlib import Path;p=Path(sys.argv[1]);assert p.stat().st_size>500000 and b"ftyp" in p.read_bytes()[:32],f"Invalid media: {p}"' "/tmp/speakathon-input.mp4"
            "$FFMPEG" -y -loglevel error -stats -i /tmp/speakathon-input.mp4 -map 0:v:0 -map 0:a:0? -vf "scale='min(540,iw)':-2,fps=25" -c:v libx264 -preset veryfast -crf 25 -maxrate 1100k -bufsize 2300k -pix_fmt yuv420p -c:a aac -b:a 96k -movflags +faststart "$dest/$name.mp4"
            python -c 'import sys;from pathlib import Path;p=Path(sys.argv[1]);assert p.stat().st_size>200000 and b"ftyp" in p.read_bytes()[:32],f"Invalid transcoded video: {p}";print("READY",p,p.stat().st_size)' "$dest/$name.mp4"
            rm -f /tmp/speakathon-input.mp4
          done <<'RECORDINGS'
          day-02 https://at.adobe.com/qathBl8yygkiPzC4
          day-03 https://at.adobe.com/2LFG5f3pNOLNwHgt
          day-04 https://at.adobe.com/hU671LNc4DOcxpwV
          day-05 https://at.adobe.com/LpUc9iDyEaGRKDA6
          day-06 https://at.adobe.com/o4QQE0iKig15qfUP
          day-07 https://at.adobe.com/UYIO7G0GDkUbksNf
          day-08 https://at.adobe.com/vkKVGrt6KbzEkdDi
          day-09 https://at.adobe.com/shlmDwE2xmNZiF0h
          day-10 https://at.adobe.com/zLKiC3FVFiFTbCOE
          day-11 https://at.adobe.com/HbhQ9xX0mgnyjodv
          day-15 https://at.adobe.com/s05woG0mnO6tvI4E
          day-02-solution https://at.adobe.com/QqYIP4ABBirb5w3e
          day-03-solution https://at.adobe.com/rg97CVzstCCa9Wgp
          introduction https://at.adobe.com/NgJIyVmsf6gBWNk4
          closing https://at.adobe.com/vl1PFdaDg6r5BhLr
          RECORDINGS
      - name: Verify files and generate media manifest
        run: |
          set -euo pipefail
          node --check output/shalini-rathod-website/courses-data.js
          node --check output/shalini-rathod-website/academy-learn.js
          grep -q 'class="learn-video"' output/shalini-rathod-website/lms-learn.html
          grep -q 'aspect-ratio:9/16' output/shalini-rathod-website/academy-learn.css
          grep -q 'video.currentTime>limit' output/shalini-rathod-website/academy-learn.js
          test ! -f output/shalini-rathod-website/lms-player.js
          ! grep -q 'SPEAKATHON STUDY SPACE' output/shalini-rathod-website/style.css
          test -f output/shalini-rathod-website/academy-learn.js
          node --check output/shalini-rathod-website/lms.js
          python - <<'PY'
          import json
          from pathlib import Path
          p=Path("output/shalini-rathod-website")
          assert (p/"index.html").exists()
          assert (p/"services.html").exists()
          assert (p/"lms-learn.html").exists()
          assert len(list((p/"assets/lms/pdfs").glob("day-*.pdf")))==21
          assert (p/"assets/lms/videos/day-01.mp4").stat().st_size>50000000
          text=(p/"courses-data.js").read_text()
          assert "drive.google.com" not in text
          assert "drive.google.com" not in (p/"lms-learn.html").read_text()
          included_days=[d for d in range(1,22) if (p/f"assets/lms/videos/day-{d:02d}.mp4").is_file()]
          needed_days=[d for d in range(1,22) if d not in included_days]
          assert included_days==list(range(1,12))+[15],f"Unexpected available days {included_days}"
          specials=["day-02-solution","day-03-solution","introduction","closing"]
          assert all((p/f"assets/lms/videos/{name}.mp4").exists() for name in specials)
          manifest={"included":{"videos":included_days,"daily_worksheets":list(range(1,22)),"extra_recordings":specials},"requires_media_upload":{"videos":needed_days,"extra_resources":True},"notes":"Videos and PDFs load locally; there are no Drive redirects. Oversized original day recordings require authorized manual transfer before those days can be played."}
          (p/"SELF_HOSTED_MEDIA_README.md").write_text("# Speakathon locally hosted recordings\\n\\nIncluded days: "+", ".join(map(str,included_days))+"\\nMissing days: "+", ".join(map(str,needed_days))+"\\n\\nCopy the remaining challenge videos to assets/lms/videos/day-XX.mp4. The learning page never links out to Drive.\\n",encoding="utf-8")
          (p/"MEDIA_STATUS.json").write_text(json.dumps(manifest,indent=2))
          print('VALIDATED video days',included_days,'missing',needed_days,'21 PDFs and on-site player')
          PY
          du -sh output/shalini-rathod-website
      - name: Package downloadable website ZIP
        uses: actions/upload-artifact@v4
        with:
          name: Shalini-Speakathon-Additional-Videos
          path: output/shalini-rathod-website/
          retention-days: 1
          compression-level: 0
          if-no-files-found: error
